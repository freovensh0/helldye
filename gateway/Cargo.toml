[package]
name = "helldye-gateway"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
axum = "0.8"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
strip = true
