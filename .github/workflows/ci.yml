name: ci

on:
    pull_request:
    push:
        branches: [main]
        paths-ignore:
            - 'docs/**'
            - '**/*.md'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    android:
        name: Debug build, unit tests, lint
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7

            - name: Contract guard
              run: ./scripts/check-contract.sh

            - name: Set up JDK 25
              uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: 25
                  cache: gradle

            - uses: android-actions/setup-android@v4

            - name: Install Android SDK 37
              run: |
                  yes | sdkmanager --licenses >/dev/null 2>&1 || true
                  sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

            - name: Restore debug keystore
              uses: actions/cache@v6
              with:
                  path: ~/.android/debug.keystore
                  key: helldye-debug-keystore-v1

            - name: Create debug keystore
              run: |
                  mkdir -p ~/.android
                  if [ ! -f ~/.android/debug.keystore ]; then
                      keytool -genkeypair -v \
                          -keystore ~/.android/debug.keystore \
                          -storepass android \
                          -alias androiddebugkey \
                          -keypass android \
                          -keyalg RSA -keysize 2048 -validity 10000 \
                          -dname "CN=Android Debug,O=Android,C=US"
                  fi

            - name: Build, test, and lint
              run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --build-cache

            - name: Upload debug APK
              if: success()
              uses: actions/upload-artifact@v7
              with:
                  name: helldye-debug
                  path: app/build/outputs/apk/debug/app-debug.apk
                  if-no-files-found: error

            - name: Upload failure reports
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: helldye-reports
                  path: |
                      app/build/reports
                      app/build/test-results
                  if-no-files-found: ignore
